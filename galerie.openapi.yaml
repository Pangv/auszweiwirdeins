{
  'openapi': '3.0.3',
  'info':
    {
      'title': 'Galerie API',
      'version': '1.0.0',
      'description': 'Backend-API für die Galerie-Anwendung',
    },
  'servers':
    [
      { 'url': 'http://localhost:3000', 'description': 'Local development' },
      { 'url': 'https://auszweiwirdeins.de', 'description': 'Production' },
    ],
  'paths':
    {
      '/api/upload':
        {
          'post':
            {
              'summary': 'Bilder hochladen (max. 20 Dateien, 20 MB pro Datei)',
              'security': [{ 'UploadPassword': [] }, { 'OwnerId': [] }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'multipart/form-data':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['photos'],
                              'properties':
                                {
                                  'photos':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'string', 'format': 'binary' },
                                      'description': 'Bilddateien (JPEG, PNG, WebP, HEIC, HEIF)',
                                    },
                                  'metaDates':
                                    {
                                      'type': 'string',
                                      'description': 'JSON-String mit clientseitig ausgelesenen EXIF-Daten, keyed by original filename',
                                    },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': 'Upload erfolgreich',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/UploadResponse' } },
                        },
                    },
                  '400': { 'description': 'Owner-ID fehlt / Keine Dateien hochgeladen' },
                  '401': { 'description': 'Falsches Upload-Passwort' },
                  '413': { 'description': 'Datei zu groß (max. 20 MB)' },
                  '429': { 'description': 'Zu viele Uploads (Rate Limit)' },
                },
            },
        },
      '/api/photos':
        {
          'get':
            {
              'summary': 'Fotos paginiert abrufen',
              'parameters':
                [
                  {
                    'name': 'limit',
                    'in': 'query',
                    'schema': { 'type': 'integer', 'default': 50, 'maximum': 100 },
                    'description': 'Anzahl der Fotos pro Seite',
                  },
                  {
                    'name': 'offset',
                    'in': 'query',
                    'schema': { 'type': 'integer', 'default': 0 },
                    'description': 'Offset für Paginierung',
                  },
                ],
              'responses':
                {
                  '200':
                    {
                      'description': 'Liste der Fotos',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/PhotosListResponse' } },
                        },
                    },
                },
            },
          'delete':
            {
              'summary': 'Eigene Fotos bulk-löschen (max. 200 IDs)',
              'security': [{ 'OwnerId': [] }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['ids'],
                              'properties':
                                {
                                  'ids':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'string', 'format': 'uuid' },
                                      'maxItems': 200,
                                    },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': 'Löschvorgang abgeschlossen',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/BulkDeleteResponse' } },
                        },
                    },
                  '400': { 'description': 'Owner-ID fehlt / Keine IDs übergeben / Zu viele IDs' },
                },
            },
        },
      '/api/photos/download':
        {
          'post':
            {
              'summary': 'Fotos als ZIP bulk-downloaden (max. 500 IDs)',
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['ids'],
                              'properties':
                                {
                                  'ids':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'string', 'format': 'uuid' },
                                      'maxItems': 500,
                                    },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': 'ZIP-Datei mit den angeforderten Fotos',
                      'content':
                        {
                          'application/zip': { 'schema': { 'type': 'string', 'format': 'binary' } },
                        },
                    },
                  '400': { 'description': 'Keine IDs / Zu viele IDs' },
                  '404': { 'description': 'Keine Fotos gefunden' },
                },
            },
        },
      '/api/photos/{id}/download':
        {
          'get':
            {
              'summary': 'Einzelfoto als WebP-Download',
              'parameters':
                [
                  {
                    'name': 'id',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string', 'format': 'uuid' },
                  },
                ],
              'responses':
                {
                  '200':
                    {
                      'description': 'Bilddatei (WebP)',
                      'content':
                        { 'image/webp': { 'schema': { 'type': 'string', 'format': 'binary' } } },
                    },
                  '404': { 'description': 'Foto nicht gefunden / Datei fehlt' },
                },
            },
        },
      '/api/stats':
        {
          'get':
            {
              'summary': 'Galerie-Statistiken abrufen',
              'responses':
                {
                  '200':
                    {
                      'description': 'Statistiken',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/StatsResponse' } },
                        },
                    },
                },
            },
        },
      '/api/storage':
        {
          'get':
            {
              'summary': 'Server-Speicherkapazität abrufen',
              'responses':
                {
                  '200':
                    {
                      'description': 'Speicherinformationen',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/StorageResponse' } },
                        },
                    },
                },
            },
        },
      '/api/auth/upload-password':
        {
          'post':
            {
              'summary': 'Upload-Passwort prüfen',
              'security': [{ 'UploadPassword': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': 'Passwort gültig',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    { 'success': { 'type': 'boolean', 'enum': [true] } },
                                },
                            },
                        },
                    },
                  '401': { 'description': 'Falsches Passwort' },
                },
            },
        },
      '/api/admin/photos':
        {
          'delete':
            {
              'summary': 'Admin: Beliebige Fotos löschen (max. 500 IDs)',
              'security': [{ 'AdminPassword': [] }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['ids'],
                              'properties':
                                {
                                  'ids':
                                    {
                                      'type': 'array',
                                      'items': { 'type': 'string', 'format': 'uuid' },
                                      'maxItems': 500,
                                    },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': 'Löschvorgang abgeschlossen',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/BulkDeleteResponse' } },
                        },
                    },
                  '400': { 'description': 'Keine IDs / Zu viele IDs' },
                  '401': { 'description': 'Falsches Admin-Passwort' },
                },
            },
        },
    },
  'components':
    {
      'securitySchemes':
        {
          'UploadPassword':
            {
              'type': 'apiKey',
              'in': 'header',
              'name': 'X-Upload-Password',
              'description': 'Passwort zum Hochladen von Bildern',
            },
          'AdminPassword':
            {
              'type': 'apiKey',
              'in': 'header',
              'name': 'x-admin-password',
              'description': 'Admin-Passwort zum Löschen beliebiger Bilder',
            },
          'OwnerId':
            {
              'type': 'apiKey',
              'in': 'header',
              'name': 'X-Owner-Id',
              'description': 'Eindeutige Owner-ID zur Identifikation des Besitzers',
            },
        },
      'schemas':
        {
          'Photo':
            {
              'type': 'object',
              'properties':
                {
                  'id': { 'type': 'string', 'format': 'uuid' },
                  'filename': { 'type': 'string', 'example': 'uuid.webp' },
                  'thumb': { 'type': 'string', 'example': 'uuid_thumb.webp' },
                  'owner_id': { 'type': 'string' },
                  'size':
                    {
                      'type': 'integer',
                      'description': 'Gesamtgröße in Bytes (Original + Thumbnail)',
                    },
                  'created_at': { 'type': 'string', 'format': 'date-time' },
                  'taken_at': { 'type': 'string', 'format': 'date-time', 'nullable': true },
                },
            },
          'UploadResponse':
            {
              'type': 'object',
              'properties':
                {
                  'success': { 'type': 'boolean' },
                  'uploaded':
                    {
                      'type': 'integer',
                      'description': 'Anzahl der erfolgreich hochgeladenen Dateien',
                    },
                  'photos':
                    {
                      'type': 'array',
                      'items':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'id': { 'type': 'string', 'format': 'uuid' },
                              'filename': { 'type': 'string' },
                              'thumb': { 'type': 'string' },
                            },
                        },
                    },
                },
            },
          'PhotosListResponse':
            {
              'type': 'object',
              'properties':
                {
                  'total': { 'type': 'integer', 'description': 'Gesamtanzahl der Fotos' },
                  'limit': { 'type': 'integer' },
                  'offset': { 'type': 'integer' },
                  'photos': { 'type': 'array', 'items': { '$ref': '#/components/schemas/Photo' } },
                },
            },
          'StatsResponse':
            {
              'type': 'object',
              'properties':
                {
                  'totalPhotos': { 'type': 'integer' },
                  'totalSizeBytes': { 'type': 'integer' },
                  'maxSizeBytes': { 'type': 'integer' },
                  'usedPercent': { 'type': 'number', 'format': 'float' },
                  'totalSizeGb': { 'type': 'number', 'format': 'float' },
                  'maxSizeGb': { 'type': 'integer' },
                },
            },
          'StorageResponse':
            {
              'type': 'object',
              'properties':
                {
                  'totalGb': { 'type': 'number', 'format': 'float' },
                  'usedGb': { 'type': 'number', 'format': 'float' },
                  'freeGb': { 'type': 'number', 'format': 'float' },
                  'usedPercent': { 'type': 'number', 'format': 'float' },
                  'freePercent': { 'type': 'number', 'format': 'float' },
                },
            },
          'BulkDeleteResponse':
            {
              'type': 'object',
              'properties':
                {
                  'success': { 'type': 'boolean' },
                  'deleted': { 'type': 'array', 'items': { 'type': 'string', 'format': 'uuid' } },
                  'failed':
                    {
                      'type': 'array',
                      'items':
                        {
                          'type': 'object',
                          'properties':
                            {
                              'id': { 'type': 'string', 'format': 'uuid' },
                              'reason': { 'type': 'string', 'enum': ['not_found', 'forbidden'] },
                            },
                        },
                    },
                  'deletedCount': { 'type': 'integer' },
                  'failedCount': { 'type': 'integer' },
                },
            },
        },
    },
}
